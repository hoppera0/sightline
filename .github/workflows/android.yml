name: Android app

# Builds the Android app from the same index.html as the website. On main, the signed APK
# is published as a release, so the phone can download it straight from the Releases page.
on:
  push:
    branches: [main]
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build the signed APK
        run: gradle -p android assembleRelease --no-daemon
      - name: Name it
        run: cp android/app/build/outputs/apk/release/app-release.apk Sightline.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Sightline-apk
          path: Sightline.apk
      - name: Publish the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Sightline for Android (build ${{ github.run_number }})
          make_latest: 'true'
          files: Sightline.apk
          body: |
            Download **Sightline.apk** on your phone and open it to install.
            Android asks once to allow installs from your browser; say yes.
            Each new build installs over the last one. Android 10 or later.
