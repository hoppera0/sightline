<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf4f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17141d" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/glow.png">
<title>Glow</title>
<link rel="stylesheet" href="ui.css">
<style>
  .stage { position: relative; display: grid; place-items: center; padding: 10px 0 16px; }
  #view { display: block; max-width: 100%; max-height: 56vh; border-radius: 26px;
          box-shadow: 0 30px 60px -30px rgba(80,50,90,.45), 0 0 0 1px var(--line); touch-action: manipulation; }
  .pal { width: 64px; height: 44px; padding: 0; border-radius: var(--pill); flex: none; border: 0; cursor: pointer;
         box-shadow: 0 0 0 1px var(--line) inset; transition: transform .15s; }
  .pal[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--ink); }
  .pal:active { transform: scale(.94); }
  .swatches { display: flex; gap: 10px; margin-top: 12px; padding: 0 2px; }
  .swatches label { position: relative; width: 44px; height: 44px; border-radius: var(--pill);
                    box-shadow: 0 0 0 1px var(--line) inset, 0 6px 14px -8px rgba(0,0,0,.4); overflow: hidden; }
  .swatches input { position: absolute; inset: -8px; width: 60px; height: 60px; border: 0; opacity: 0; cursor: pointer; }
  .slider { grid-template-columns: 76px 1fr; }
</style>
</head>
<body>
<header>
  <a href="./" aria-label="All apps">‹</a>
  <div><h1>Glow</h1><p>Soft gradient wallpapers and posters</p></div>
</header>
<main>
  <div class="stage"><canvas id="view" aria-label="Preview"></canvas></div>

  <section class="card">
    <h2>Style</h2>
    <div class="row" id="styles"></div>
  </section>

  <section class="card">
    <h2>Palette</h2>
    <div class="row" id="palettes"></div>
    <div class="swatches" id="swatches"></div>
  </section>

  <section class="card">
    <h2>Size</h2>
    <div class="row" id="sizes"></div>
  </section>

  <section class="card">
    <h2>Feel</h2>
    <div class="slider"><span>Softness</span><input type="range" id="soft" min="0" max="100" value="60"></div>
    <div class="slider"><span>Grain</span><input type="range" id="grain" min="0" max="100" value="18"></div>
    <div class="slider"><span>Light</span><input type="range" id="light" min="0" max="100" value="50"></div>
  </section>

  <section class="card">
    <h2>Words (optional)</h2>
    <input type="text" id="words" placeholder="Type a line to set on it" maxlength="80" autocomplete="off">
  </section>
</main>

<div class="dock">
  <button class="btn" id="shuffle" type="button">Shuffle</button>
  <button class="btn primary" id="save" type="button">Save to phone</button>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const view = $('#view'), vctx = view.getContext('2d');

  const PALETTES = {
    Peach:  ['#ffd1c1', '#ff9a8b', '#ffc3a0', '#fbe3e8'],
    Lilac:  ['#e0c3fc', '#a18cd1', '#fbc2eb', '#c9d6ff'],
    Lagoon: ['#a1c4fd', '#c2e9fb', '#84fab0', '#8fd3f4'],
    Sorbet: ['#ff9a9e', '#fecfef', '#fad0c4', '#ffd1ff'],
    Dusk:   ['#2b2d6e', '#a65b9e', '#ff8a7a', '#ffcfa3'],
    Mint:   ['#d4fc79', '#96e6a1', '#c1f0e5', '#f6fff8'],
    Night:  ['#0f0c29', '#302b63', '#6d5dfc', '#24243e'],
  };
  const SIZES = {
    'Phone': [1179, 2556], 'Story 9:16': [1080, 1920], 'Square': [2048, 2048],
    'Post 4:5': [1080, 1350], 'Desktop': [2560, 1440],
  };
  const STYLES = ['Mesh', 'Aurora', 'Orbs', 'Linear', 'Radial'];

  const S = { style: 'Mesh', palette: 'Peach', colors: PALETTES.Peach.slice(), size: 'Phone',
              soft: 60, grain: 18, light: 50, words: '', seed: 7 };
  try { Object.assign(S, JSON.parse(localStorage.getItem('glow') || '{}')); } catch (e) {}

  // Seeded random, so a shuffle can be saved at full size exactly as previewed.
  function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  function hexA(hex, a) { const n = parseInt(hex.slice(1), 16);
    return 'rgba(' + (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255) + ',' + a + ')'; }
  function mix(hex, k) { // k < 0 darker, k > 0 lighter
    const n = parseInt(hex.slice(1), 16); const f = (v) => Math.round(k >= 0 ? v + (255 - v) * k : v * (1 + k));
    return 'rgb(' + f(n >> 16 & 255) + ',' + f(n >> 8 & 255) + ',' + f(n & 255) + ')'; }

  // Draw at any resolution: the same seed and settings give the same picture.
  function paint(c, W, H) {
    const r = rng(S.seed), cols = S.colors, m = Math.max(W, H), soft = 0.35 + S.soft / 100 * 0.9;
    const lk = (S.light - 50) / 100;
    c.save();
    c.fillStyle = mix(cols[0], lk); c.fillRect(0, 0, W, H);
    if (S.style === 'Linear') {
      const a = r() * Math.PI * 2, dx = Math.cos(a) * W / 2, dy = Math.sin(a) * H / 2;
      const g = c.createLinearGradient(W / 2 - dx, H / 2 - dy, W / 2 + dx, H / 2 + dy);
      cols.forEach((col, i) => g.addColorStop(i / (cols.length - 1), mix(col, lk)));
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    } else if (S.style === 'Radial') {
      const g = c.createRadialGradient(W * (0.3 + r() * 0.4), H * (0.3 + r() * 0.4), 0, W / 2, H / 2, m * 0.85);
      cols.forEach((col, i) => g.addColorStop(i / (cols.length - 1), mix(col, lk)));
      c.fillStyle = g; c.fillRect(0, 0, W, H);
    } else if (S.style === 'Aurora') {
      const bands = 5;
      for (let b = 0; b < bands; b++) {
        const col = cols[b % cols.length], y0 = H * (0.15 + b / bands * 0.8), amp = H * (0.05 + r() * 0.12);
        const ph = r() * 6.28, fr = 1 + r() * 2, th = H * 0.18 * soft;
        const g = c.createLinearGradient(0, y0 - th, 0, y0 + th);
        g.addColorStop(0, hexA(col, 0)); g.addColorStop(0.5, hexA(col, 0.85)); g.addColorStop(1, hexA(col, 0));
        c.fillStyle = g; c.beginPath(); c.moveTo(0, H);
        for (let x = 0; x <= W; x += W / 60) c.lineTo(x, y0 + Math.sin(x / W * 6.28 * fr + ph) * amp - th);
        for (let x = W; x >= 0; x -= W / 60) c.lineTo(x, y0 + Math.sin(x / W * 6.28 * fr + ph) * amp + th);
        c.closePath(); c.fill();
      }
    } else {
      const n = S.style === 'Orbs' ? 7 : 6;
      for (let i = 0; i < n; i++) {
        const col = cols[i % cols.length], x = r() * W, y = r() * H;
        const rad = S.style === 'Orbs' ? m * (0.1 + r() * 0.18) : m * (0.35 + r() * 0.35) * soft;
        const g = c.createRadialGradient(x, y, 0, x, y, rad);
        const hard = S.style === 'Orbs' ? 1 - S.soft / 140 : 0;
        g.addColorStop(0, hexA(col, 0.95)); g.addColorStop(Math.min(0.95, hard), hexA(col, S.style === 'Orbs' ? 0.9 : 0.6));
        g.addColorStop(1, hexA(col, 0));
        c.fillStyle = g; c.fillRect(0, 0, W, H);
      }
    }
    if (S.words.trim()) {
      const fs = Math.round(Math.min(W, H) * 0.085);
      c.font = '800 ' + fs + 'px ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif';
      c.textAlign = 'center'; c.textBaseline = 'middle';
      c.fillStyle = S.light > 60 ? 'rgba(40,30,50,.85)' : 'rgba(255,255,255,.92)';
      c.shadowColor = 'rgba(0,0,0,.18)'; c.shadowBlur = fs * 0.4;
      wrap(c, S.words.trim(), W / 2, H / 2, W * 0.8, fs * 1.1);
      c.shadowBlur = 0;
    }
    c.restore();
    if (S.grain > 0) grain(c, W, H, S.grain / 100);
  }
  function wrap(c, text, x, y, maxW, lh) {
    const words = text.split(/\s+/), lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    lines.push(cur);
    lines.forEach((l, i) => c.fillText(l, x, y + (i - (lines.length - 1) / 2) * lh));
  }
  // Film grain, so a smooth gradient does not band when it is compressed.
  function grain(c, W, H, k) {
    const img = c.getImageData(0, 0, W, H), d = img.data, a = k * 38;
    let s = 1234567;
    for (let i = 0; i < d.length; i += 4) {
      s ^= s << 13; s ^= s >>> 17; s ^= s << 5;
      const n = ((s & 255) / 255 - 0.5) * a;
      d[i] += n; d[i + 1] += n; d[i + 2] += n;
    }
    c.putImageData(img, 0, 0);
  }

  function preview() {
    const [W, H] = SIZES[S.size], dpr = Math.min(2, window.devicePixelRatio || 1);
    const maxW = Math.min(520, document.querySelector('main').clientWidth - 8), maxH = window.innerHeight * 0.56;
    const k = Math.min(maxW / W, maxH / H);
    view.style.width = Math.round(W * k) + 'px'; view.style.height = Math.round(H * k) + 'px';
    view.width = Math.round(W * k * dpr); view.height = Math.round(H * k * dpr);
    paint(vctx, view.width, view.height);
    try { localStorage.setItem('glow', JSON.stringify(S)); } catch (e) {}
  }

  function chips(host, items, get, set, make) {
    host.innerHTML = '';
    for (const it of items) {
      const b = make ? make(it) : Object.assign(document.createElement('button'), { className: 'chip', textContent: it });
      b.type = 'button'; b.setAttribute('aria-pressed', String(get() === it));
      b.addEventListener('click', () => { set(it); host.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); syncSwatches(); preview(); });
      host.appendChild(b);
    }
  }
  function syncSwatches() {
    const host = $('#swatches'); host.innerHTML = '';
    S.colors.forEach((col, i) => {
      const l = document.createElement('label'); l.style.background = col; l.title = 'Colour ' + (i + 1);
      const inp = Object.assign(document.createElement('input'), { type: 'color', value: col });
      inp.setAttribute('aria-label', 'Colour ' + (i + 1));
      inp.addEventListener('input', () => { S.colors[i] = inp.value; l.style.background = inp.value; S.palette = ''; preview(); });
      l.appendChild(inp); host.appendChild(l);
    });
  }

  chips($('#styles'), STYLES, () => S.style, (v) => { S.style = v; });
  chips($('#sizes'), Object.keys(SIZES), () => S.size, (v) => { S.size = v; });
  chips($('#palettes'), Object.keys(PALETTES), () => S.palette, (v) => { S.palette = v; S.colors = PALETTES[v].slice(); }, (name) => {
    const b = document.createElement('button'); b.className = 'pal'; b.title = name; b.setAttribute('aria-label', name + ' palette');
    b.style.background = 'linear-gradient(135deg,' + PALETTES[name].join(',') + ')'; return b;
  });
  syncSwatches();
  for (const id of ['soft', 'grain', 'light']) {
    const el = $('#' + id); el.value = S[id];
    el.addEventListener('input', () => { S[id] = Number(el.value); preview(); });
  }
  const words = $('#words'); words.value = S.words;
  words.addEventListener('input', () => { S.words = words.value; preview(); });
  $('#shuffle').addEventListener('click', () => {
    S.seed = (Math.random() * 1e9) | 0;
    if (navigator.vibrate) navigator.vibrate(8);
    preview();
  });
  view.addEventListener('click', () => $('#shuffle').click());

  let toastT = 0;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2400); }

  // Full resolution. On a phone, the share sheet is the way into Photos / Gallery.
  $('#save').addEventListener('click', async () => {
    const [W, H] = SIZES[S.size];
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    paint(c.getContext('2d'), W, H);
    const blob = await new Promise((r) => c.toBlob(r, 'image/png'));
    await saveBlob(blob, 'glow-' + S.style.toLowerCase() + '-' + S.seed + '.png');
  });
  async function saveBlob(blob, name) {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'Glow' }); toast('Saved'); return; }
      catch (e) { if (e && e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Saved to Downloads');
  }
  window.addEventListener('resize', preview);
  preview();
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  window.glow = { state: S, paint, preview };
})();
</script>
</body>
</html>
